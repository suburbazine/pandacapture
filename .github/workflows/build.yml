name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scons pycryptodome comma-deps-gcc-arm-none-eabi
      - run: python firmware/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: pandacapture/firmware_bin/

  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: RP1210/J2534 bridge (Windows)
        if: runner.os == 'Windows'
        run: python adapter/build.py
      - run: python -m pytest -q
      - run: python -m pandacapture selftest

  package:
    needs: [firmware, test]
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: pandacapture-windows-x64.exe
            exe: dist/pandacapture.exe
          - os: ubuntu-22.04  # older glibc, so the program runs on more distributions
            asset: pandacapture-linux-x64
            exe: dist/pandacapture
          # macOS comes later:
          # - os: macos-14
          #   asset: pandacapture-macos-arm64
          #   exe: dist/pandacapture
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: pandacapture/firmware_bin
      - run: pip install ".[package]"
      - name: RP1210/J2534 bridge (Windows)
        if: runner.os == 'Windows'
        run: python adapter/build.py
      - run: python packaging/build_exe.py
      - name: Smoke test
        shell: bash
        run: |
          ${{ matrix.exe }} selftest
          ${{ matrix.exe }} info || true
      - shell: bash
        run: mv ${{ matrix.exe }} dist/${{ matrix.asset }}
      - name: Windows zip with the double-click launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory bundle | Out-Null
          Copy-Item dist/${{ matrix.asset }} bundle/pandacapture.exe
          Copy-Item launchers/windows/* bundle/
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md bundle/
          Compress-Archive -Path bundle/* -DestinationPath dist/pandacapture-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/pandacapture-windows-x64.zip
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pandacapture-*
          path: out
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware
      - name: Firmware zip and checksums
        run: |
          (cd firmware && zip -r "../out/pandacapture-firmware-${{ github.ref_name }}.zip" .)
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/* --repo "${{ github.repository }}" --generate-notes
