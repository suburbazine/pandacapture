[project]
name = "pandacapture"
dynamic = ["version"]
description = "CAN capture, firmware flashing and gated transmit for comma Red and Black Pandas"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = [
  "libusb1>=3.1",
  "libusb-package>=1.0.26",
  "pyserial>=3.5",          # ELM327 OBD adapters (USB, Bluetooth serial, WiFi)
  "anthropic>=1.11",        # pandacapture analyze: your own API key, Opus or Fable
  "keyring>=25",            # where pandacapture apikey keeps that key
]

[project.optional-dependencies]
dev = ["pytest", "scons", "pycryptodome"]
package = ["pyinstaller>=6.10"]

[project.scripts]
pandacapture = "pandacapture.cli:main"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pandacapture"]

[tool.setuptools.dynamic]
version = {attr = "pandacapture.__version__"}

[tool.setuptools.package-data]
pandacapture = ["firmware_bin/*", "firmware_bin/*/*", "maps/*.json", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
