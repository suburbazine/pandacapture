[project]
name = "pandacapture"
dynamic = ["version"]
description = "CAN capture, firmware flashing and gated transmit for comma Red and Black Pandas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "libusb1>=3.1",
  "libusb-package>=1.0.26",
]

[project.optional-dependencies]
dev = ["pytest", "scons", "pycryptodome"]
package = ["pyinstaller>=6.10"]

[project.scripts]
pandacapture = "pandacapture.cli:main"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pandacapture"]

[tool.setuptools.dynamic]
version = {attr = "pandacapture.__version__"}

[tool.setuptools.package-data]
pandacapture = ["firmware_bin/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
