<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PandaCapture Dashboard</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
  /* Dark by default: the page is made for a car at night. The light theme overrides the same tokens. */
  :root {
    --bg: #0b0e13;
    --panel: #141922;
    --panel-2: #1b2230;
    --line: #2a3344;
    --text: #e8edf5;
    --muted: #8b97ab;
    --faint: #556074;
    --accent: #4fb3ff;
    --ok: #4fb3ff;
    --warn: #ffb020;
    --alert: #ff4d4f;
    --green: #35d07f;
    --blue: #4fb3ff;
    --amber: #ffb020;
    --red: #ff4d4f;
    --radius: 12px;
    --gap: 10px;
    --pad: 16px;
    --ctl: 40px;           /* control height: big enough to tap in a moving car */
    --value: 30px;         /* the big number on a tile */
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f3f5f9;
    --panel: #ffffff;
    --panel-2: #e9edf3;
    --line: #d8dee8;
    --text: #141a24;
    --muted: #5c6779;
    --faint: #9aa3b2;
    --accent: #0b74d1;
    --ok: #0b74d1;
    --warn: #c77700;
    --alert: #d92d2f;
    --green: #148a4b;
    --blue: #0b74d1;
    --amber: #c77700;
    --red: #d92d2f;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  /* Lamp and level colors, set once per element so the rules below can share them */
  .c-red { --lc: var(--red); }
  .c-amber { --lc: var(--amber); }
  .c-green { --lc: var(--green); }
  .c-blue { --lc: var(--blue); }
  .lvl-warn { --lc: var(--warn); }
  .lvl-alert { --lc: var(--alert); }

  /* ---- header: title and status on one row, controls on the next ---- */
  header {
    position: sticky; top: 0; z-index: 2;
    display: flex; flex-direction: column; gap: 8px;
    padding: 8px var(--pad) 10px;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .bar { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
  .title { display: flex; flex-direction: column; min-width: 0; flex: 1 1 160px; }
  .title strong { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title span { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 26px; padding: 0 10px; border-radius: 999px;
    background: var(--panel-2); color: var(--muted);
    font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .pill.live { color: var(--text); }
  .pill.live .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .pill.down { color: var(--alert); }
  .pill.down .dot { background: var(--alert); }

  .controls { gap: 8px; }
  .ctl-group { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .ctl-group.mode { margin-left: auto; }
  .ctl {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: var(--ctl); min-width: var(--ctl); padding: 0 14px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 10px; font: inherit; font-size: 14px; white-space: nowrap; cursor: pointer;
  }
  .ctl:hover:not(:disabled) { border-color: var(--accent); }
  a.ctl { text-decoration: none; }
  .ctl:disabled { opacity: .45; cursor: default; }
  .ctl.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ctl svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .ctl.icon { padding: 0 10px; }
  .rec { font-weight: 600; }
  .rec .dot { width: 10px; height: 10px; background: var(--red); }
  .rec.on { border-color: var(--red); background: color-mix(in srgb, var(--red) 18%, var(--panel)); }
  .rec.on .dot { animation: blink 1.2s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  .ctl.select { gap: 6px; padding-right: 6px; flex: 0 1 auto; }
  .ctl.select span { color: var(--muted); font-size: 12px; }
  .ctl select { min-width: 0; max-width: 220px; border: 0; background: transparent; color: var(--text); font: inherit; text-overflow: ellipsis; }
  .ctl select option { background: var(--panel); color: var(--text); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button {
    min-height: calc(var(--ctl) - 2px); padding: 0 12px; border: 0;
    background: var(--panel); color: var(--muted); font: inherit; font-size: 14px; white-space: nowrap; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  .banner {
    margin: 12px var(--pad) 0; padding: 10px 14px; border-radius: 10px;
    background: color-mix(in srgb, var(--alert) 15%, var(--panel)); color: var(--text);
    border: 1px solid color-mix(in srgb, var(--alert) 45%, transparent);
    display: none;
  }
  .banner.show { display: block; }

  /* ---- page body: attention strip, gauges, then the groups ---- */
  main { padding: 4px var(--pad) 32px; max-width: 1400px; margin: 0 auto; }

  /* The replay's timeline: at the top of the (sticky) header for as long as a replay runs, so it's always in
     view and the page moves down under it */
  .replay { margin: 6px var(--pad) 2px; padding: 4px 6px 4px 12px; border: 1px solid var(--line); border-radius: 14px;
            background: var(--panel-2); box-shadow: 0 2px 10px rgb(0 0 0 / .18); }
  .replay[hidden] { display: none; }
  .replay .rtitle { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .replay .rrow { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .replay .rtime { font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--text); min-width: 44px; text-align: center; }
  .replay input[type=range] { flex: 1; min-width: 60px; accent-color: var(--accent); height: var(--ctl); }
  .replay .ctl.icon { flex: none; }
  .replay.failed .rtitle { color: var(--alert); }
  /* Always one row of fixed height, so chips coming and going never move the gauges below; more chips
     than fit scroll sideways rather than wrapping onto a second row */
  .attention {
    --lc: var(--muted); display: flex; flex-wrap: nowrap; align-items: center; gap: 8px; height: 36px;
    margin: 12px 0 2px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
  }
  .attention::-webkit-scrollbar { display: none; }
  .attention .calm { color: var(--muted); font-size: 13px; padding-left: 2px; }
  .attention .chip { flex: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px 0 10px;
    border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--text);
    background: color-mix(in srgb, var(--lc) 18%, var(--panel));
    border: 1px solid color-mix(in srgb, var(--lc) 55%, transparent);
  }
  .chip .dot { background: var(--lc); box-shadow: 0 0 8px var(--lc); }
  .chip .val { color: var(--lc); font-variant-numeric: tabular-nums; }
  .band { margin-top: 12px; }

  /* Per-cylinder knock retard (E019): a bar per cylinder with its peak since the session (or replay) began */
  .knocktile { cursor: pointer; }
  .knocktile .kpeak { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .kbars { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
  .kcyl { display: grid; justify-items: center; gap: 3px; font-size: 12px; }
  .kcol { position: relative; width: 100%; max-width: 46px; height: 78px; border-radius: 6px; background: var(--panel-2); overflow: hidden; }
  .kfill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 6px 6px 0 0; background: var(--ok); }
  .kfill.warn { background: var(--warn); }
  .kfill.alert { background: var(--alert); }
  .kmark { position: absolute; left: 0; right: 0; height: 2px; background: var(--text); opacity: .7; }
  .kcyl .kv { font-weight: 600; }
  .kcyl .kn { color: var(--faint); font-size: 11px; }
  .knocktile.stale .kfill, .knocktile.stale .kmark { opacity: .35; }
  .knocktile.stale .kv { color: var(--faint); }
  .grid { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .grid.gauges { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .grid.lights { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .grid + .grid { margin-top: var(--gap); }

  /* Pinned: copies of the tiles starred below, in the order they were pinned: gauges, then numbers and lamps */
  .pinned { display: flex; flex-direction: column; gap: var(--gap); padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .pinned .grid + .grid { margin-top: 0; }
  .band-title { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }

  .groups-bar { display: flex; align-items: center; gap: 4px; margin: 18px 0 0; }
  .groups-bar span { flex: 1; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .link { min-height: 36px; padding: 0 10px; border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; border-radius: 8px; }
  .link:hover { background: var(--panel); }
  details.group { border-top: 1px solid var(--line); }
  details.group > summary {
    list-style: none; display: flex; align-items: center; gap: 10px;
    min-height: 44px; padding: 2px 0; cursor: pointer; user-select: none;
  }
  details.group > summary::-webkit-details-marker { display: none; }
  details.group > summary:hover .gname { color: var(--text); }
  .chev { flex: none; width: 8px; height: 8px; margin: 0 4px 3px 2px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
  details[open] > summary .chev { transform: rotate(45deg); margin-bottom: 6px; }
  .gname { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .gcount { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .gbadge { display: none; margin-left: auto; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--lc); background: color-mix(in srgb, var(--lc) 16%, transparent); }
  .gbadge.show { display: inline-block; }
  .gbadge.on { --lc: var(--green); }
  details.group > .body { padding: 4px 0 16px; }

  /* ---- tiles ---- */
  .tile {
    position: relative; min-width: 0; padding: 10px 12px 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  }
  .tile .head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-right: 26px; }
  /* The star in every tile's corner: pins a copy to the top, or unpins it */
  .pin {
    position: absolute; top: 5px; right: 5px; z-index: 1;
    display: grid; place-items: center; width: 28px; height: 28px; padding: 0;
    border: 0; border-radius: 8px; background: none; color: var(--faint); cursor: pointer;
  }
  .pin svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
  .pin:hover { color: var(--text); background: var(--panel-2); }
  .pin[aria-pressed="true"] { color: var(--amber); }
  .pin[aria-pressed="true"] svg { fill: currentColor; }
  .tile .label { min-width: 0; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile { cursor: help; }
  /* The label gets the whole row: the signal's source is in its description (tap or hover the tile) */
  .tile .hz { display: none; flex: none; font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }
  body.high .tile .hz { display: block; }
  .num { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 6px; margin-top: 4px; }
  .num .v { font-size: var(--value); font-weight: 650; line-height: 1.2; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .num .v.txt { font-size: 22px; }     /* a word (gear, drive mode) rather than a number */
  .num .u { color: var(--muted); font-size: 13px; }
  .tile.lvl-warn, .tile.lvl-alert { border-color: color-mix(in srgb, var(--lc) 60%, var(--line)); }
  .tile.lvl-alert { background: color-mix(in srgb, var(--alert) 10%, var(--panel)); }
  .lvl-warn .v, .lvl-warn .gv, .lvl-alert .v, .lvl-alert .gv { color: var(--lc); fill: var(--lc); }
  .gauge > svg { display: block; width: 100%; height: auto; margin-top: 2px; }
  .gauge .track { stroke: var(--panel-2); }
  .gauge .val { stroke: var(--ok); }
  .gauge.lvl-warn .val, .gauge.lvl-alert .val { stroke: var(--lc); }
  .gauge .zone-warn { stroke: var(--warn); opacity: .6; }
  .gauge .zone-alert { stroke: var(--alert); opacity: .7; }
  .gv { fill: var(--text); font-size: var(--value); font-weight: 650; font-variant-numeric: tabular-nums; }
  .gu { fill: var(--muted); font-size: 12px; }
  .gm { fill: var(--faint); font-size: 10px; font-variant-numeric: tabular-nums; }
  canvas.trace { display: none; width: 100%; height: 34px; margin-top: 6px; }
  body.high canvas.trace { display: block; }

  /* Lamps: a hollow ring when off, a filled glowing one with a tinted tile when on */
  .light { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 14px; }
  .lamp { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--faint); transition: background .15s, box-shadow .15s; }
  .tile.light { padding-right: 40px; }
  .light .label { white-space: normal; line-height: 1.25; }
  .light .sub { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .light.on { background: color-mix(in srgb, var(--lc) 14%, var(--panel)); border-color: color-mix(in srgb, var(--lc) 55%, var(--line)); }
  .light.on .lamp { background: var(--lc); border-color: var(--lc); box-shadow: 0 0 14px var(--lc); }
  .light.on .label { color: var(--text); font-weight: 600; }
  .light.on .sub { color: var(--muted); }

  /* Stale and no-data tiles look different from live ones, not just dimmer: dashed edge, gray value, a tag */
  .tile.stale { border-style: dashed; }
  /* The stale tag: in the label's row (the label gives way while it shows), or a lamp's top corner */
  .tile.stale .hz { display: none; }
  .tile.stale .head::after, .tile.nodata .head::after, .light.stale::after, .light.nodata::after {
    content: "stale"; flex: none; align-self: center;
    padding: 1px 7px; border-radius: 999px; font-size: 10px; letter-spacing: .04em; text-transform: uppercase;
    color: var(--muted); background: var(--panel-2);
  }
  .light.stale::after, .light.nodata::after { position: absolute; top: 9px; right: 38px; }
  .tile.nodata .head::after, .light.nodata::after { content: "no data"; color: var(--faint); }
  .tile.stale .v, .tile.stale .gv, .tile.stale .label { color: var(--faint); fill: var(--faint); }
  .tile.stale .val { stroke: var(--faint); opacity: .5; }
  .tile.nodata .val { visibility: hidden; }
  .light.stale .lamp { border-style: dashed; background: transparent; box-shadow: none; }

  /* A tile's description (full label, how it's decoded, its source and notes), on a tap or click */
  .info {
    position: absolute; z-index: 1; max-width: min(360px, calc(100vw - 24px)); padding: 10px 12px;
    border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    font-size: 13px; line-height: 1.4; white-space: pre-line; box-shadow: 0 8px 24px rgb(0 0 0 / .35);
  }
  .info b { display: block; margin-bottom: 4px; }

  footer { color: var(--faint); font-size: 12px; padding: 0 var(--pad) 24px; max-width: 1400px; margin: 0 auto; }

  /* ---- narrow screens: a phone in a cradle ---- */
  @media (max-width: 720px) {
    .ctl .txt, .seg .txt, .ctl.select span { display: none; }
    .ctl.select { flex: 1 1 100px; }
    .ctl select { width: 100%; max-width: none; }
    .ctl-group.tools { flex: 1 1 100%; order: 3; }
  }
  @media (max-width: 480px) {
    :root { --pad: 12px; --gap: 8px; --value: 26px; }
    .title span { display: none; }
    .strip .pill { padding: 0 8px; }
    .grid, .grid.gauges, .grid.lights { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tile { padding: 8px 10px 10px; }
    .light { padding: 8px 10px; gap: 10px; }
  }
</style>
</head>
<body>
<header>
  <div class="replay" id="replayBar" hidden role="group" aria-label="Replay timeline">
    <div class="rtitle" id="replayTitle">Replay</div>
    <div class="rrow">
      <button class="ctl icon" id="replayPlay" type="button" title="Pause" aria-label="Pause">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="replayIcon" d="M8 5v14M16 5v14"/></svg></button>
      <span class="rtime" id="replayPos">0:00</span>
      <input type="range" id="replaySlider" min="0" max="1" step="0.01" value="0" aria-label="Position in the replay">
      <span class="rtime" id="replayDur">0:00</span>
      <button class="ctl icon" id="replayStop" type="button" title="Stop the replay" aria-label="Stop the replay">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
    </div>
  </div>
  <div class="bar">
    <div class="title"><strong id="mapName">PandaCapture</strong><span id="vehicle">Loading address map…</span></div>
    <div class="strip">
      <span class="pill" id="status"><span class="dot"></span><span id="statusText">connecting</span></span>
      <span class="pill" id="rate">0 frames/s</span>
      <span class="pill" id="sps" hidden>0 samples/s</span>
    </div>
  </div>
  <div class="bar controls">
    <div class="ctl-group">
      <button class="ctl rec" id="recBtn" type="button" title="Start or stop recording a capture"><span class="dot"></span><span id="recText">Record</span></button>
      <button class="ctl" id="markBtn" type="button" title="Marker into the recording (key M)" disabled>Marker</button>
    </div>
    <div class="ctl-group mode">
      <span class="seg" role="group" aria-label="Update rate">
        <button type="button" id="modeNormal" aria-pressed="true" title="Latest values, 10 times a second">Normal</button>
        <button type="button" id="modeHigh" aria-pressed="false" title="Every sample, as fast as it's received">High<span class="txt"> resolution</span></button>
      </span>
    </div>
    <div class="ctl-group tools">
      <label class="ctl select" title="Address map"><span>Map</span><select id="mapSel" aria-label="Address map"></select></label>
      <label class="ctl select" title="Replay a capture from the captures folder, with a timeline to play, pause, scrub and stop">
        <span>Replay</span><select id="replaySel" aria-label="Replay a capture"><option value="">a capture…</option></select></label>
      <a class="ctl" id="capturesLink" href="/captures.html" target="pandacapture-captures"
         title="Captures: find signals, bundles, Claude (opens its own window; the gauges keep running)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v4H4zM4 11h16v8H4zM8 15h8"/></svg><span class="txt">Captures</span></a>
      <a class="ctl" id="runsLink" href="/runs.html" target="pandacapture-runs"
         title="Runs: performance runs from your captures, timed and coached (opens its own window)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9M15 6h5v5"/></svg><span class="txt">Runs</span></a>
      <a class="ctl" id="devtoolsLink" href="/devtools.html" target="pandacapture-devtools"
         title="Developer Tools: a workbench for tools built onto the dashboard (opens its own window)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6l-4 6 4 6M16 6l4 6-4 6M13 4l-2 16"/></svg><span class="txt">Developer Tools</span></a>
      <button class="ctl" id="units" type="button">US</button>
      <button class="ctl icon" id="theme" type="button" title="Switch light/dark" aria-label="Switch light/dark theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9c0-.5 0-1-.1-1.4A6 6 0 0 1 13.4 3.1C13 3 12.5 3 12 3z"/></svg><span class="txt">Theme</span>
      </button>
      <button class="ctl icon" id="full" type="button" title="Full screen" aria-label="Full screen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="txt">Full screen</span>
      </button>
    </div>
  </div>
</header>
<div class="banner" id="banner"></div>
<main id="main">
  <div class="attention" id="attention"><span class="calm">No warnings</span></div>
  <section class="band pinned" id="pinned" hidden><div class="band-title">Pinned</div>
    <div class="grid gauges"></div><div class="grid"></div></section>
  <section class="band" id="knock" hidden>
    <div class="tile knocktile" id="knockTile" role="button" tabindex="0"
         title="Knock retard per cylinder, from the ECU's answers to 22 E019 (whoever asks). The mark is each cylinder's peak since this session or replay began; click to reset the peaks.">
      <div class="head"><div class="label">Knock retard (E019)</div><div class="kpeak" id="knockPeak"></div></div>
      <div class="kbars" id="knockBars"></div>
    </div>
  </section>
  <section class="band" id="gauges" hidden><div class="grid gauges"></div></section>
  <div class="groups-bar" id="groupsBar" hidden><span>Details</span>
    <button class="link" id="openAll" type="button">Expand all</button>
    <button class="link" id="closeAll" type="button">Collapse all</button></div>
  <div id="groups"></div>
</main>
<footer id="foot"></footer>

<script src="/units.js"></script>
<script>
(() => {
  "use strict";

  // ---- page state ----
  const STALE_MS = 1500;     // a value older than this is shown as stale (same as the server)
  const TRACE_MS = 10000;    // the trace window in high-resolution mode
  const MAX_POINTS = 2000;   // trace points kept per signal: a 100 Hz signal fills 1,000 in the window
  const tiles = {};          // key -> tile (see the tile builders)
  const live = {};           // key -> {v, seen (ms), hist: [[ms, v]], count, hz, level, on}
  const groups = {};         // group name -> {details, badge, badgeText}
  const pins = {};           // key -> the pinned copy of its tile
  const stars = {};          // key -> the star on its own tile
  let pinned = [], pinStore = "";   // pinned keys in pin order, remembered per map in this browser
  let signals = [], source = null, mode = "normal", dirty = true;
  let recording = false, mapVersion = null;

  // ---- small helpers ----
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const clock = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  const fmt = (v, d) => (v === null || v === undefined) ? "--" :
    Number(v).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  // Units: values arrive (and are judged, traced and zoned) in the map's units; only the text is converted
  const U = window.PCUnits;
  const cv = (s) => U.conversion(s.unit || "");
  const shownValue = (s, v) => { const c = cv(s); return fmt(v * c.f + c.o, (s.decimals || 0) + c.extra); };
  const shownWith = (s, v) => `${shownValue(s, v)} ${cv(s).unit}`.trim();
  const post = (path, body, raw) => fetch(path, raw ? { method: "POST", body } :
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) })
    .then(async (r) => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.statusText); return j; });
  const flash = (text) => {
    const b = $("banner"); b.textContent = text; b.classList.add("show");
    clearTimeout(flash.t); flash.t = setTimeout(() => b.classList.remove("show"), 4000);
  };
  const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();

  // ---- remembered per browser: theme, update rate, which groups are open ----
  const remember = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const recall = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const openGroups = (() => { try { return JSON.parse(recall("pc-groups")) || {}; } catch (e) { return {}; } })();
  const rememberGroup = (name, open) => { openGroups[name] = open; remember("pc-groups", JSON.stringify(openGroups)); };

  if (recall("pc-theme")) root.dataset.theme = recall("pc-theme");
  // US or metric: the tiles' text follows (their arcs, zones and traces are in the map's units either way)
  U.button($("units"));
  U.onChange(() => {
    for (const t of [...Object.values(tiles), ...Object.values(pins)]) t.relabel?.();
    dirty = true;
  });
  $("theme").onclick = () => {
    root.dataset.theme = root.dataset.theme === "light" ? "dark" : "light";
    remember("pc-theme", root.dataset.theme);
    dirty = true;   // traces take their colors from the theme
  };
  $("full").onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else root.requestFullscreen?.();
  };

  // ---- signal rules: the same as the server's Signal.level() and light_on() ----
  const level = (s, v) => {
    if ((s.alert_above != null && v > s.alert_above) || (s.alert_below != null && v < s.alert_below)) return "alert";
    if ((s.warn_above != null && v > s.warn_above) || (s.warn_below != null && v < s.warn_below)) return "warn";
    return "ok";
  };
  const lightOn = (s, v) => (s.on_above != null || s.on_below != null)
    ? ((s.on_above != null && v > s.on_above) || (s.on_below != null && v < s.on_below)) : v !== 0;
  const labelFor = (s, v) => (s.labels && Number.isInteger(v)) ? s.labels[String(v)] : undefined;
  const describe = (s) => `${s.label} (${s.key})\n` + (s.expr ? `= ${s.expr}` :
    `ID ${s.id}, byte ${s.byte}` + (s.bit ? `, bit ${s.bit}` : "") +
    `, ${s.bits || 8} bits, ${s.order || "little"}-endian\nx${s.scale ?? 1}` + (s.offset ? ` ${s.offset > 0 ? "+" : ""}${s.offset}` : "")) +
    (s.unit ? ` ${s.unit}` : "") + `\nSource: ${s.source}` + (s.note ? `\n${s.note}` : "");

  // ---- tiles: each is {el, s, hz, canvas, show(v)} ----
  // Gauge: a 270-degree arc around (100, 90). pathLength=100 makes dash lengths percentages.
  const arc = (r) => {
    const a = (deg) => [100 + r * Math.cos(deg * Math.PI / 180), 90 + r * Math.sin(deg * Math.PI / 180)];
    const [x0, y0] = a(135), [x1, y1] = a(45);
    return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 1 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
  };
  const ARC = arc(66), ZONE = arc(80);
  const pct = (s, v) => Math.max(0, Math.min(100, (v - s.min) / (s.max - s.min) * 100));

  function zones(s) {
    let out = "";
    const z = (cls, a, b) => {
      if (b > a) out += `<path class="${cls}" d="${ZONE}" pathLength="100" fill="none" stroke-width="5" stroke-dasharray="0 ${a} ${b - a} 200" />`;
    };
    if (s.warn_above != null) z("zone-warn", pct(s, s.warn_above), s.alert_above != null ? pct(s, s.alert_above) : 100);
    if (s.alert_above != null) z("zone-alert", pct(s, s.alert_above), 100);
    if (s.warn_below != null) z("zone-warn", s.alert_below != null ? pct(s, s.alert_below) : 0, pct(s, s.warn_below));
    if (s.alert_below != null) z("zone-alert", 0, pct(s, s.alert_below));
    return out;
  }

  const name = (s) => s.short || s.label;
  const head = (s) => `<div class="head"><div class="label">${esc(name(s))}</div><div class="hz">–</div></div>`;
  const tileEl = (s, cls) => {
    const el = document.createElement("div");
    el.className = `tile ${cls} stale nodata`;   // every tile starts without data
    el.title = describe(s);
    return el;
  };

  function gaugeTile(s) {
    const el = tileEl(s, "gauge");
    el.innerHTML = head(s) + `
      <svg viewBox="0 0 200 172" role="img" aria-label="${esc(s.label)}">
        <path class="track" d="${ARC}" pathLength="100" fill="none" stroke-width="13" stroke-linecap="round" />
        ${zones(s)}
        <path class="val" d="${ARC}" pathLength="100" fill="none" stroke-width="13" stroke-linecap="round" stroke-dasharray="0 200" />
        <text class="gv" x="100" y="98" text-anchor="middle">--</text>
        <text class="gu" x="100" y="118" text-anchor="middle"></text>
        <text class="gm" x="44" y="168" text-anchor="middle"></text>
        <text class="gm" x="156" y="168" text-anchor="middle"></text>
      </svg><canvas class="trace"></canvas>`;
    const val = el.querySelector(".val"), text = el.querySelector(".gv"), unit = el.querySelector(".gu");
    const [lo, hi] = el.querySelectorAll(".gm");
    let last = null;
    const t = { el, s, hz: el.querySelector(".hz"), canvas: el.querySelector("canvas"), show(v) {
      last = v;
      text.textContent = shownValue(s, v);
      val.setAttribute("stroke-dasharray", `${pct(s, v)} 200`);
    }, relabel() {
      const c = cv(s), d = Math.max(0, c.extra - 1);
      unit.textContent = c.unit;
      lo.textContent = fmt(s.min * c.f + c.o, d);
      hi.textContent = fmt(s.max * c.f + c.o, d);
      if (last !== null) text.textContent = shownValue(s, last);
    }};
    t.relabel();
    return t;
  }

  function numberTile(s) {
    const el = tileEl(s, "number");
    el.innerHTML = head(s) + `<div class="num"><span class="v">--</span><span class="u">${esc(s.unit || "")}</span></div>
      <canvas class="trace"></canvas>`;
    const v = el.querySelector(".v"), u = el.querySelector(".u");
    let last = null;
    const t = { el, s, hz: el.querySelector(".hz"), canvas: el.querySelector("canvas"), show(x) {
      last = x;
      const label = labelFor(s, x);
      v.textContent = label ?? shownValue(s, x);
      v.classList.toggle("txt", label !== undefined);
      u.hidden = label !== undefined;
    }, relabel() {
      u.textContent = cv(s).unit;
      if (last !== null) t.show(last);
    }};
    t.relabel();
    return t;
  }

  function lightTile(s) {
    const el = tileEl(s, `light c-${s.color || "red"}`);
    // Its condition in the units set
    const cond = () => s.on_above != null ? `on above ${shownWith(s, s.on_above)}` :
                       s.on_below != null ? `on below ${shownWith(s, s.on_below)}` : "";
    el.innerHTML = `<div class="lamp"></div><div><div class="label">${esc(name(s))}</div>` +
      (cond() ? `<div class="sub"></div>` : "") + `</div>`;
    const sub = el.querySelector(".sub");
    let last = null;
    const t = { el, s, show(v) {
      last = v;
      if (sub) sub.textContent = `${shownWith(s, v)} · ${cond()}`;
    }, relabel() {
      if (sub) sub.textContent = last !== null ? `${shownWith(s, last)} · ${cond()}` : cond();
    }};
    t.relabel();
    return t;
  }

  // ---- pinning: a star on every tile puts a copy in the Pinned band at the top ----
  const STAR = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>`;
  const setStar = (b, s, on) => {
    b.setAttribute("aria-pressed", String(on));
    b.title = on ? "Unpin from the top" : "Pin a copy to the top";
    b.setAttribute("aria-label", `${on ? "Unpin" : "Pin"} ${s.label}`);
  };
  const info = document.createElement("div");
  info.className = "info";
  info.hidden = true;
  document.body.appendChild(info);
  const hideInfo = () => { info.hidden = true; info.owner = null; };
  function showInfo(t) {
    if (info.owner === t.el) return hideInfo();
    const [first, ...rest] = describe(t.s).split("\n");
    info.innerHTML = `<b>${esc(first)}</b>${esc(rest.join("\n"))}`;
    info.hidden = false;
    info.owner = t.el;
    const r = t.el.getBoundingClientRect(), w = info.offsetWidth, h = info.offsetHeight;
    let y = r.bottom + 6;                                   // below the tile, or above it if there's no room
    if (y + h > innerHeight - 12 && r.top - h - 6 > 12) y = r.top - h - 6;
    info.style.left = `${scrollX + Math.min(Math.max(12, r.left), innerWidth - w - 12)}px`;
    info.style.top = `${scrollY + y}px`;
  }
  // It scrolls with the page, and closes on a tap elsewhere or when the width changes (a phone turned round)
  document.addEventListener("click", (e) => { if (!info.hidden && !e.target.closest(".tile")) hideInfo(); });
  let infoWidth = innerWidth;
  addEventListener("resize", () => { if (innerWidth !== infoWidth) { infoWidth = innerWidth; hideInfo(); } });

  function makeTile(s, copy) {
    const t = s.display === "gauge" ? gaugeTile(s) : s.display === "light" ? lightTile(s) : numberTile(s);
    t.el.addEventListener("click", (e) => { if (!e.target.closest(".pin")) showInfo(t); });
    const b = document.createElement("button");
    b.type = "button";
    b.className = "pin";
    b.innerHTML = STAR;
    b.onclick = () => togglePin(s.key);
    setStar(b, s, copy || pinned.includes(s.key));
    if (!copy) stars[s.key] = b;
    t.el.appendChild(b);
    return t;
  }
  function togglePin(key) {
    const i = pinned.indexOf(key);
    if (i < 0) pinned.push(key); else pinned.splice(i, 1);
    remember(pinStore, JSON.stringify(pinned));
    setStar(stars[key], tiles[key].s, i < 0);
    renderPins();
  }
  function renderPins() {
    const box = $("pinned");
    const [gauges, small] = box.querySelectorAll(".grid");
    if (info.owner?.closest("#pinned")) hideInfo();
    for (const g of [gauges, small]) g.innerHTML = "";
    for (const k of Object.keys(pins)) delete pins[k];
    for (const key of pinned) {
      const t = pins[key] = makeTile(tiles[key].s, true);
      (t.s.display === "gauge" ? gauges : small).appendChild(t.el);
    }
    for (const g of [gauges, small]) g.hidden = !g.children.length;
    box.hidden = !pinned.length;
    dirty = true;
  }

  // ---- building the page from the map ----
  // Gauges go in one band at the top whatever their group: they are the driving values. Every
  // group then gets a collapsible section for its numbers and lamps, in the map's order.
  function build(map) {
    $("mapName").textContent = map.name;
    $("vehicle").textContent = [map.vehicle, map.bitrate ? `${map.bitrate} kbit/s` : ""].filter(Boolean).join(" · ");
    document.title = `${map.name} · PandaCapture`;
    $("foot").textContent = map.notes || "";
    signals = map.signals;
    pinStore = `pc-pins:${map.name}`;
    try { pinned = JSON.parse(recall(pinStore)) || []; } catch (e) { pinned = []; }
    pinned = pinned.filter((k) => signals.some((s) => s.key === k));   // signals since dropped from the map

    const make = (s) => {
      const t = makeTile(s, false);
      tiles[s.key] = t;
      live[s.key] = { v: null, seen: 0, hist: [], count: 0, hz: 0, level: null, on: false };
      return t.el;
    };
    const gaugeGrid = $("gauges").querySelector(".grid");
    gaugeGrid.innerHTML = "";
    for (const s of signals) if (s.display === "gauge") gaugeGrid.appendChild(make(s));
    $("gauges").hidden = !gaugeGrid.children.length;

    const byGroup = new Map();
    for (const s of signals) {
      if (s.display === "gauge") continue;
      const g = s.group || "Signals";
      if (!byGroup.has(g)) byGroup.set(g, []);
      byGroup.get(g).push(s);
    }
    const holder = $("groups");
    holder.innerHTML = "";
    for (const [name, list] of byGroup) {
      const details = document.createElement("details");
      details.className = "group";
      details.open = openGroups[name] !== false;
      details.innerHTML = `<summary><span class="chev"></span><span class="gname">${esc(name)}</span>
        <span class="gcount">${list.length}</span><span class="gbadge"></span></summary><div class="body"></div>`;
      const body = details.querySelector(".body");
      for (const kind of ["number", "light"]) {
        const items = list.filter((s) => s.display === kind);
        if (!items.length) continue;
        const grid = document.createElement("div");
        grid.className = "grid" + (kind === "light" ? " lights" : "");
        for (const s of items) grid.appendChild(make(s));
        body.appendChild(grid);
      }
      details.addEventListener("toggle", () => rememberGroup(name, details.open));
      groups[name] = { details, badge: details.querySelector(".gbadge"), badgeText: "" };
      for (const s of list) s._group = name;
      holder.appendChild(details);
    }
    $("groupsBar").hidden = byGroup.size < 2;
    renderPins();
  }
  const setAll = (open) => { for (const [name, g] of Object.entries(groups)) { g.details.open = open; rememberGroup(name, open); } };
  $("openAll").onclick = () => setAll(true);
  $("closeAll").onclick = () => setAll(false);

  // ---- attention strip: lit lamps and values in a warn or alert zone, above the gauges ----
  // A chip stays HOLD_MS after its condition clears, and keeps its place, so a value hovering at a
  // threshold (spark on its minimum at idle) doesn't make the strip flicker
  const HOLD_MS = 3000;
  const attention = { sig: "", vals: {}, held: new Map() };   // key -> { item, until }, in first-seen order
  function showAttention(items) {
    const now = performance.now();
    for (const i of items) {
      const h = attention.held.get(i.key);
      if (h) { h.item = i; h.until = now + HOLD_MS; } else attention.held.set(i.key, { item: i, until: now + HOLD_MS });
    }
    for (const [k, h] of attention.held) if (h.until < now) attention.held.delete(k);
    const shown = [...attention.held.values()].map((h) => h.item);
    const sig = shown.map((i) => i.key + ":" + i.cls).join(",");
    const strip = $("attention");
    if (sig !== attention.sig) {
      attention.sig = sig;
      attention.vals = {};
      strip.innerHTML = shown.length ? shown.map((i) => `<span class="chip ${i.cls}"><span class="dot"></span>${esc(i.label)}` +
        (i.value !== undefined ? ` <span class="val" data-k="${esc(i.key)}"></span>` : "") + `</span>`).join("")
        : `<span class="calm">No warnings</span>`;
      strip.querySelectorAll(".val").forEach((el) => attention.vals[el.dataset.k] = el);
    }
    for (const i of shown) if (i.value !== undefined) attention.vals[i.key].textContent = i.value;
  }

  // ---- the replay ----
  // While a replay runs the page judges freshness and draws traces by the replay's clock (the server's
  // CLOCK_BASE plus the position), which stops while it's paused, so paused values stay bright. Rates per
  // second stay on the wall clock.
  const REPLAY_BASE_MS = 10000 * 1000;
  let rp = null, rpAt = 0, epoch = null, dragging = null;
  const replayPos = () => {
    if (!rp) return 0;
    const pos = rp.phase === "playing" ? rp.position + (performance.now() - rpAt) / 1000 * (rp.speed || 1) : rp.position;
    return Math.max(0, Math.min(rp.duration || 0, pos));
  };
  const clockNow = () => rp && rp.phase !== "failed" ? REPLAY_BASE_MS + replayPos() * 1000 : performance.now();
  // Seconds as m:ss (h:mm:ss past an hour)
  const hms = (secs) => {
    const t = Math.max(0, Math.floor(secs));
    const two = (n) => String(n).padStart(2, "0");
    return t >= 3600 ? `${Math.floor(t / 3600)}:${two(Math.floor(t / 60) % 60)}:${two(t % 60)}` : `${Math.floor(t / 60)}:${two(t % 60)}`;
  };
  // A replay starting, going back or ending: what's shown belongs to another time, so forget it
  function forget() {
    for (const l of Object.values(live)) { l.v = null; l.seen = 0; l.hist = []; }
    for (const t of [...Object.values(tiles), ...Object.values(pins)]) { t.shown = false; t.el.classList.add("nodata"); }
    dirty = true;
  }
  function applyReplay(r, ep) {
    if (ep !== undefined) { if (epoch !== null && ep !== epoch) forget(); epoch = ep; }
    rp = r || null;
    rpAt = performance.now();
    renderReplay();
  }
  let replayShown = "";
  function renderReplay() {
    const bar = $("replayBar");
    bar.hidden = !rp;
    if (!rp) { replayShown = ""; return; }
    const indexing = rp.phase === "indexing", failed = rp.phase === "failed", playing = rp.phase === "playing";
    const pos = dragging ?? replayPos();
    const key = [rp.name, rp.phase, rp.message, rp.duration, Math.floor(pos * 4), dragging !== null].join("|");
    if (key === replayShown) return;
    replayShown = key;
    bar.classList.toggle("failed", failed);
    $("replayTitle").textContent = `Replay · ${rp.name}` + (indexing ? " · reading the log…" : rp.phase === "ended" ? " · end" :
      failed ? ` · ${rp.message || "failed"}` : "");
    $("replayPos").textContent = hms(pos);
    $("replayDur").textContent = hms(rp.duration || 0);
    const sl = $("replaySlider");
    sl.max = String(rp.duration || 1);
    if (dragging === null) sl.value = String(pos);
    sl.disabled = indexing || failed || !(rp.duration > 0);
    const b = $("replayPlay");
    b.disabled = indexing || failed;
    b.title = playing ? "Pause" : "Play";
    b.setAttribute("aria-label", b.title);
    $("replayIcon").setAttribute("d", playing ? "M8 5v14M16 5v14" : "M7 4.5l12 7.5-12 7.5z");
  }
  const replay = (body) => post("/replay", body).then((j) => {
    applyReplay(j.replay, j.replay?.epoch);
    if (rp && body.action === "seek") { rp.position = body.s; rpAt = performance.now(); renderReplay(); }
  }).catch((e) => flash(e.message));
  $("replayPlay").onclick = () => replay({ action: rp?.phase === "playing" ? "pause" : "play" });
  $("replayStop").onclick = () => replay({ action: "stop" });
  // While the thumb is held it shows where you're dragging to; the seek happens on release
  $("replaySlider").addEventListener("input", (e) => { dragging = Number(e.target.value); renderReplay(); });
  $("replaySlider").addEventListener("change", (e) => {
    const s = Number(e.target.value);
    dragging = null;
    replay({ action: "seek", s });
  });
  // The picker lists the captures folder each time it's opened
  const fillReplays = () => fetch("/captures").then((r) => r.json()).then((c) => {
    const sel = $("replaySel");
    sel.innerHTML = `<option value="">a capture…</option>` + c.captures.filter((x) => !x.recording)
      .map((x) => `<option value="${esc(x.name)}">${esc(x.name)}</option>`).join("");
  }).catch(() => {});
  $("replaySel").addEventListener("pointerdown", fillReplays);
  $("replaySel").addEventListener("focus", fillReplays);
  $("replaySel").addEventListener("change", (e) => {
    const name = e.target.value;
    e.target.value = "";
    if (name) replay({ capture: name }).then(() => flash(`Replaying ${name}`));
  });

  // ---- per-cylinder knock (E019): shown once the first answer is heard ----
  const KNOCK_CYLS = 6;
  $("knockBars").innerHTML = Array.from({ length: KNOCK_CYLS }, (_, i) =>
    `<div class="kcyl"><div class="kcol"><div class="kfill"></div><div class="kmark"></div></div>` +
    `<span class="kv">–</span><span>${i + 1}</span><span class="kn" title="Raw knock-sensor noise (unverified)"></span></div>`).join("");
  const kcyls = [...$("knockBars").querySelectorAll(".kcyl")];
  let knockShown = "";
  function renderKnock(k) {
    $("knock").hidden = !k;
    if (!k) { knockShown = ""; return; }
    const key = JSON.stringify([k.retard, k.peak, k.noise, k.stale]);
    if (key === knockShown) return;
    knockShown = key;
    $("knockTile").classList.toggle("stale", !!k.stale);
    const top = Math.max(6, ...k.peak, ...k.retard);
    k.retard.forEach((deg, i) => {
      const c = kcyls[i];
      const fill = c.querySelector(".kfill");
      fill.style.height = `${Math.min(100, deg / top * 100)}%`;
      fill.className = "kfill" + (deg > 3 ? " alert" : deg >= 1.5 ? " warn" : "");
      c.querySelector(".kmark").style.bottom = `calc(${Math.min(100, k.peak[i] / top * 100)}% - 1px)`;
      c.querySelector(".kmark").hidden = !(k.peak[i] > 0);
      c.querySelector(".kv").textContent = `${fmt(deg, 2)}°`;
      c.querySelector(".kn").textContent = `noise ${k.noise[i]}`;
    });
    const worst = Math.max(...k.peak);
    $("knockPeak").textContent = worst > 0 ? `peak ${fmt(worst, 2)}° on ${k.peak.indexOf(worst) + 1}` : "no retard";
  }
  const resetKnock = () => post("/knock/reset").then(() => { renderKnock(null); flash("Knock peaks reset"); }).catch((e) => flash(e.message));
  $("knockTile").addEventListener("click", resetKnock);
  $("knockTile").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); resetKnock(); } });

  // ---- incoming data ----
  function status(st) {
    applyReplay(st.replay, st.epoch);
    renderKnock(st.knock);
    const ok = st.status === "live" || !!st.replay;
    $("status").className = "pill " + (ok ? "live" : st.status === "disconnected" ? "down" : "");
    $("statusText").textContent = st.replay ? "replay" : st.status === "idle" ? "no panda" : ok ? "live" : st.status;
    $("status").title = st.source || "";
    $("rate").textContent = `${(st.fps || 0).toLocaleString()} frames/s`;
    recording = !!st.recording;
    $("recBtn").classList.toggle("on", recording);
    $("recBtn").title = recording ? `Recording to ${st.recording}. Click to stop and save.` : "Start recording a capture";
    $("recText").textContent = recording ? `Stop  ${clock(st.recording_for || 0)}` : "Record";
    $("markBtn").disabled = !recording;
    $("markBtn").textContent = st.markers ? `Marker (${st.markers})` : "Marker";
    if (mapVersion === null) mapVersion = st.map_version;
    else if (st.map_version !== mapVersion) location.reload();   // the map changed: rebuild from scratch
    const banner = $("banner");
    banner.textContent = st.error || "";
    banner.classList.toggle("show", !!st.error);
  }

  function snapshot(st) {
    status(st);
    const now = clockNow();
    for (const [k, d] of Object.entries(st.values || {})) {
      const l = live[k];
      if (!l) continue;
      l.v = d.v;
      l.seen = now - d.age * 1000;
      if (mode === "high") { l.hist.push([now, d.v]); trim(l, now); }
    }
    dirty = true;
  }

  // Trace history is trimmed as samples arrive, not only when drawing: browsers stop drawing in
  // hidden tabs, and a trace trimmed only there would grow without limit.
  function trim(l, now) {
    let drop = 0;
    while (drop < l.hist.length && now - l.hist[drop][0] > TRACE_MS) drop++;
    drop = Math.max(drop, l.hist.length - MAX_POINTS);
    if (drop > 0) l.hist.splice(0, drop);
  }

  let sampleCount = 0;
  function samples(batch) {
    const now = clockNow();
    const touched = new Set();
    for (const [k, v] of batch.s) {
      const l = live[k];
      if (!l) continue;
      l.v = v;
      l.seen = now;
      l.hist.push([now, v]);
      l.count++;
      touched.add(l);
    }
    for (const l of touched) trim(l, now);
    sampleCount += batch.s.length;
    if (batch.lost) {
      $("banner").textContent = `This page fell behind and skipped ${batch.lost.toLocaleString()} samples.`;
      $("banner").classList.add("show");
    }
    dirty = true;
  }

  // ---- drawing, once per screen refresh ----
  function drawTrace(t, l, now) {
    const c = t.canvas;
    if (!c) return;
    const w = c.clientWidth, h = c.clientHeight, dpr = window.devicePixelRatio || 1;
    if (!w) return;
    if (c.width !== Math.round(w * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
    const g = c.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    const pts = l.hist;
    if (pts.length < 2) return;
    const s = t.s;
    let lo = s.min, hi = s.max;
    if (lo == null || hi == null) {
      lo = Infinity; hi = -Infinity;
      for (const [, v] of pts) { if (v < lo) lo = v; if (v > hi) hi = v; }
      if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
    }
    g.strokeStyle = css(l.level === "alert" ? "--alert" : l.level === "warn" ? "--warn" : "--ok");
    g.lineWidth = 1.5;
    g.beginPath();
    pts.forEach(([ms, v], i) => {
      const x = w - (now - ms) / TRACE_MS * w;
      const y = h - 2 - (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo) * (h - 4);
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    });
    g.stroke();
  }

  // Tile values, levels and lamps are refreshed only when something arrived (dirty); staleness
  // and the traces every frame.
  let rateMark = performance.now();
  function frame() {
    const wall = performance.now();
    if (wall - rateMark >= 1000) {
      const secs = (wall - rateMark) / 1000;
      for (const l of Object.values(live)) { l.hz = l.count / secs; l.count = 0; }
      $("sps").textContent = `${Math.round(sampleCount / secs).toLocaleString()} samples/s`;
      sampleCount = 0;
      rateMark = wall;
      dirty = true;
    }
    if (rp) renderReplay();
    const now = clockNow();
    const noticed = [], counts = {};
    for (const s of signals) {
      const l = live[s.key];
      if (!tiles[s.key] || !l) continue;
      const views = pins[s.key] ? [tiles[s.key], pins[s.key]] : [tiles[s.key]];
      trim(l, now);
      const stale = l.v === null || now - l.seen > STALE_MS;
      for (const t of views) t.el.classList.toggle("stale", stale);
      if (l.v === null) continue;
      for (const t of views) if (!t.shown) { t.shown = true; t.el.classList.remove("nodata"); }
      if (dirty) {
        const light = s.display === "light";
        l.level = light ? null : level(s, l.v);
        l.on = light && !stale && lightOn(s, l.v);
        for (const t of views) {
          t.show(l.v);
          t.el.classList.toggle("on", l.on);
          t.el.classList.toggle("lvl-warn", !stale && l.level === "warn");
          t.el.classList.toggle("lvl-alert", !stale && l.level === "alert");
          if (t.hz) t.hz.textContent = mode === "high" ? `${Math.round(l.hz)}/s` : "";
        }
        const c = counts[s._group] || (counts[s._group] = { alert: 0, warn: 0, on: 0 });
        if (l.on) {
          c.on++;
          // green lamps say all is well ("engine running"): lit on their tile, but not news for the strip
          if (s.color !== "green") noticed.push({ key: s.key, cls: `c-${s.color || "red"}`, label: s.label });
        } else if (!stale && l.level !== "ok" && l.level) {
          c[l.level]++;
          noticed.push({ key: s.key, cls: `lvl-${l.level}`, label: s.label, value: shownWith(s, l.v) });
        }
      }
      if (mode === "high") for (const t of views) drawTrace(t, l, now);
    }
    if (dirty) {
      showAttention(noticed);
      for (const [name, g] of Object.entries(groups)) {
        const c = counts[name] || { alert: 0, warn: 0, on: 0 };
        const [cls, text] = c.alert ? ["lvl-alert", `${c.alert} alert`] : c.warn ? ["lvl-warn", `${c.warn} warn`] :
          c.on ? ["on", `${c.on} on`] : ["", ""];
        if (text !== g.badgeText) {
          g.badgeText = text;
          g.badge.textContent = text;
          g.badge.className = "gbadge " + cls + (text ? " show" : "");
        }
      }
    }
    dirty = false;
    requestAnimationFrame(frame);
  }

  // ---- the event stream ----
  function connect(newMode) {
    mode = newMode;
    remember("pc-mode", mode);
    document.body.classList.toggle("high", mode === "high");
    $("modeNormal").setAttribute("aria-pressed", String(mode === "normal"));
    $("modeHigh").setAttribute("aria-pressed", String(mode === "high"));
    $("sps").hidden = mode !== "high";
    for (const l of Object.values(live)) l.hist = [];
    if (source) source.close();
    source = new EventSource(mode === "high" ? "/events?mode=high" : "/events");
    source.addEventListener("snapshot", (e) => snapshot(JSON.parse(e.data)));
    source.addEventListener("samples", (e) => samples(JSON.parse(e.data)));
    source.addEventListener("status", (e) => status(JSON.parse(e.data)));
    source.onerror = () => {
      $("status").className = "pill down";
      $("statusText").textContent = "reconnecting to PandaCapture";
    };
  }
  // A hidden tab doesn't need the live stream: pause it, and pick it up again with fresh values when
  // the tab comes back. Recording carries on regardless: PandaCapture records, not the page.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      if (source) { source.close(); source = null; }
    } else if (!source && signals.length) {
      connect(mode);
    }
  });
  $("modeNormal").onclick = () => mode !== "normal" && connect("normal");
  $("modeHigh").onclick = () => mode !== "high" && connect("high");

  // ---- recording, markers and the map picker ----
  $("recBtn").onclick = () => post("/record", { on: !recording })
    .then((j) => flash(j.saved ? `Saved ${j.saved}` : `Recording to ${j.recording}`))
    .catch((e) => flash(e.message));
  const marker = () => post("/marker").then((j) => flash(`Marker ${j.marker}`)).catch((e) => flash(e.message));
  $("markBtn").onclick = marker;
  document.addEventListener("keydown", (e) => {
    if (e.key.toLowerCase() === "m" && !e.repeat && !e.ctrlKey && !e.metaKey && !e.altKey
        && !(e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement)) {
      if (recording) marker();
    }
  });
  fetch("/maps").then((r) => r.json()).then((m) => {
    const sel = $("mapSel");
    sel.innerHTML = m.maps.map((n) => `<option value="${esc(n)}"${n === m.current_file ? " selected" : ""}>${esc(n)}</option>`).join("");
    if (!m.maps.includes(m.current_file)) sel.insertAdjacentHTML("afterbegin", `<option selected disabled>${esc(m.current)}</option>`);
    sel.onchange = () => post("/map", { name: sel.value }).catch((e) => flash(e.message));
  });

  // ---- start: load the map, build the page, connect in the remembered (or requested) mode ----
  fetch("/map").then((r) => r.json()).then((map) => {
    build(map);
    const wanted = new URLSearchParams(location.search).get("mode") || recall("pc-mode") || "normal";
    connect(wanted === "high" ? "high" : "normal");
    requestAnimationFrame(frame);
  }).catch(() => {
    $("vehicle").textContent = "Couldn't load the address map from PandaCapture.";
  });
})();
</script>
</body>
</html>
